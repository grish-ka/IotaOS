name: IotaOS CI Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Trigger on version tags (e.g., v0.1.2, v0.2.0-beta)
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Required permissions to create GitHub Releases
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO & Bootloader Tools
        run: |
          sudo apt-get update
          # zlib1g-dev: a native mandoc builds the man page index (mandoc.db)
          sudo apt-get install -y xorriso grub-pc-bin mtools zip zlib1g-dev

      - name: Setup i686-elf GCC Cross-Compiler
        run: |
          echo "Downloading pre-compiled OSdev toolchain..."
          wget -q https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
          unzip -q i686-elf-tools-linux.zip -d /tmp/i686-elf-toolchain
          
          # Add the downloaded bin folder to the GitHub Actions PATH
          echo "/tmp/i686-elf-toolchain/bin" >> $GITHUB_PATH

      - name: Verify Toolchain
        run: |
          i686-elf-gcc --version
          i686-elf-ld --version

      # src/gnu is not in git: keep the downloaded source tarballs (Bash, GNU
      # coreutils/sed/grep/awk/tar/..., less, ncurses, zlib, mandoc) between runs
      - name: Cache Third-Party Sources
        uses: actions/cache@v4
        with:
          path: |
            src/gnu/*.tar.gz
            src/gnu/*.tar.xz
          key: third-party-${{ hashFiles('tools/build-ports.sh', 'Makefile') }}

      - name: Compile and Package IotaOS
        run: |
          # Kernel, libc, IotaOS's own tools, then every ported package
          # (downloaded, configured and cross-compiled: Bash, GNU coreutils,
          # findutils, sed, grep, gawk, diffutils, gzip, tar, less, mandoc),
          # the root filesystem image and the bootable ISO.
          # WITH_BASH=y answers the "compile Bash?" question.
          make clean
          make iso WITH_BASH=y

      - name: Package IotaADK
        run: |
          # Zip up the ADK folder for developers to download
          cd src
          zip -r ../IotaADK.zip IotaADK
          cd ..

      - name: Upload ISO Artifact (Action Page)
        uses: actions/upload-artifact@v4
        with:
          name: IotaOS-Stable-ISO
          path: build/IotaOS.iso

      - name: Upload ADK Artifact (Action Page)
        uses: actions/upload-artifact@v4
        with:
          name: IotaADK
          path: IotaADK.zip

      - name: Publish GitHub Release
        # Only run this step if we pushed a tag starting with 'v'
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # If the tag contains a hyphen (e.g., v0.1.2-beta), mark as pre-release!
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            build/IotaOS.iso
            IotaADK.zip