name: Release IotaOS

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-os:
    name: Build Bootable ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SETUP CROSS-COMPILER & GRUB TOOLS
      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          # Use Ubuntu's built-in i686 cross-compiler (acts exactly like i686-elf when using -ffreestanding)
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu
          # Install ISO generation tools
          sudo apt-get install -y xorriso grub-pc-bin grub-common mtools

      # 2. BUILD KERNEL AND APPS
      - name: Compile IotaOS
        run: |
          # Override your Makefile variables to use the CI runner's compiler
          make all CC=i686-linux-gnu-gcc AS=i686-linux-gnu-as LD=i686-linux-gnu-ld OBJCOPY=i686-linux-gnu-objcopy

      # 3. GENERATE THE ISO
      - name: Build Bootable ISO
        run: |
          # We manually run the ISO steps here instead of 'make run'
          # If we used 'make run', QEMU would launch and freeze the GitHub Action forever!
          mkdir -p build/iso/boot/grub
          mkdir -p build/initrd_root
          cp build/IotaOS build/iso/boot/IotaOS
          
          # Pack the Ramdisk
          cd build/initrd_root && tar -cf ../iso/boot/initrd.img *
          cd ../../
          
          # Build the ISO
          cp grub.cfg build/iso/boot/grub/grub.cfg
          grub-mkrescue -o build/IotaOS.iso build/iso

      # 4. PREPARE FILES FOR RELEASE
      - name: Rename Artifacts
        run: |
          # Inject the version tag (e.g., v0.1.0) into the file names
          mv build/IotaOS.iso IotaOS-${{ github.ref_name }}.iso
          mv build/IotaOS IotaOS-kernel-${{ github.ref_name }}.bin

      # 5. UPLOAD TO GITHUB
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            IotaOS-*.iso
            IotaOS-kernel-*.bin
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}