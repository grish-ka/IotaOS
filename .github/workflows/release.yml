name: IotaOS CI Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Trigger on version tags (e.g., v0.1.2, v0.2.0-beta)
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Required permissions to create GitHub Releases
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO & Bootloader Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-pc-bin mtools zip

      - name: Setup i686-elf GCC Cross-Compiler
        run: |
          echo "Downloading pre-compiled OSdev toolchain..."
          wget -q https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
          unzip -q i686-elf-tools-linux.zip -d /tmp/i686-elf-toolchain
          
          # Add the downloaded bin folder to the GitHub Actions PATH
          echo "/tmp/i686-elf-toolchain/bin" >> $GITHUB_PATH

      - name: Verify Toolchain
        run: |
          i686-elf-gcc --version
          i686-elf-ld --version

      - name: Compile and Package IotaOS
        run: |
          # 1. Build the OS binaries
          make clean && make
          
          # 2. Package the Ramdisk and build the ISO (Without running QEMU)
          mkdir -p build/iso/boot/grub
          mkdir -p build/initrd_root
          cp build/IotaOS build/iso/boot/IotaOS
          cd build/initrd_root && tar -cf ../iso/boot/initrd.img * && cd ../..
          cp grub.cfg build/iso/boot/grub/grub.cfg
          grub-mkrescue -o build/IotaOS.iso build/iso

      - name: Package IotaADK
        run: |
          # Zip up the ADK folder for developers to download
          cd src
          zip -r ../IotaADK.zip IotaADK
          cd ..

      - name: Upload ISO Artifact (Action Page)
        uses: actions/upload-artifact@v4
        with:
          name: IotaOS-Stable-ISO
          path: build/IotaOS.iso

      - name: Upload ADK Artifact (Action Page)
        uses: actions/upload-artifact@v4
        with:
          name: IotaADK
          path: IotaADK.zip

      - name: Publish GitHub Release
        # Only run this step if we pushed a tag starting with 'v'
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # If the tag contains a hyphen (e.g., v0.1.2-beta), mark as pre-release!
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            build/IotaOS.iso
            IotaADK.zip