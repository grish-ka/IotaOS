set timeout=3
set default=0

# Load video drivers so GRUB can set up VBE / linear framebuffer
insmod all_video
insmod vbe
insmod vga

set gfxmode=1024x768x32,1024x768,auto
set gfxpayload=keep

menuentry "IotaOS (Graphics 1024x768 32bpp)" {
    set gfxpayload=1024x768x32,1024x768,auto,keep
    multiboot /boot/IotaOS
    module /boot/initrd.img
}

menuentry "IotaOS (VGA Text Console)" {
    set gfxpayload=text
    multiboot /boot/IotaOS
    module /boot/initrd.img
}