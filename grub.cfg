# Boot automatically after a few seconds instead of waiting for Enter
set timeout=3
set default=0

menuentry "IotaOS" {
    # The kernel writes straight to VGA text memory: never hand it a graphics mode
    set gfxpayload=text
    multiboot /boot/IotaOS
    module /boot/initrd.img
}